name: repository-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m compileall -q claim.py src scripts
      - run: python claim.py validate
      - run: python claim.py fixtures
      - run: python -m pytest
      - run: python scripts/run_mutation_gate.py --check-report
      - run: python scripts/sync_review_docs.py
      - run: python scripts/sync_customer_faq.py
      - run: python scripts/sync_github_issues.py --repo SoloMidMiram/Iranian-Auto-Body-Insurance-Claim-Calculation-Knowledge-Graph
