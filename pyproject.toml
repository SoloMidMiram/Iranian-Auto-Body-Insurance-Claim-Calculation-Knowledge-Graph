[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iran-auto-claim"
version = "1.0.0"
description = "Iranian motor claim calculation knowledge graph and rule engine"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
iran-claim = "iran_auto_claim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
